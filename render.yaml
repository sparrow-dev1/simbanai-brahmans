services:
  - type: web
    name: simbanai-brahmans
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/session
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: HTTPS_ONLY
        value: "1"
